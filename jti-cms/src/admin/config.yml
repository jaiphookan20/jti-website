# ---------------------------------------------------------------
# JTI website — content manager configuration (Sveltia CMS)
# Change YOUR-GITHUB-USERNAME/jti-website to your actual repo.
# ---------------------------------------------------------------
backend:
  name: github
  repo: jaiphookan20/jti-website
  branch: main

media_folder: "jti-cms/src/assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple

collections:
  # ------------------------- ITINERARIES -------------------------
  - name: itineraries
    label: Journeys (Itineraries)
    label_singular: Journey
    folder: "jti-cms/src/content/itineraries"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}  —  {{category}}"
    sortable_fields: [title, category]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: "Web address (slug)", widget: string, hint: "Lowercase, dashes. Changing this changes the page URL." }
      - { name: category, label: Category, widget: select, options: [wildlife, birding, culture] }
      - { name: kicker, label: "Kicker (small line above the title)", widget: string, required: false }
      - { name: description, label: "Search description (SEO)", widget: text, required: false }
      - { name: hero_image, label: "Hero photo", widget: image, required: false, hint: "Leave empty to keep the current stand-in image." }
      - { name: hero_fallback, label: "Stand-in photo URL", widget: string, required: false }
      - { name: lead, label: "Opening line (large italic)", widget: text }
      - { name: intro, label: "Intro paragraph", widget: text, required: false }
      - name: facts
        label: "Hero facts (the 4 items under the title)"
        widget: list
        fields:
          - { name: value, label: Value, widget: string }
          - { name: label, label: Label, widget: string }
      - { name: route, label: "Route stops", widget: list, field: { name: stop, label: Stop, widget: string } }
      - name: days
        label: "Day by day"
        widget: list
        summary: "{{fields.label}} — {{fields.title}}"
        fields:
          - { name: label, label: "Day label (e.g. Day 1 / Days 4–7)", widget: string }
          - { name: title, label: "Day title", widget: string, required: false }
          - { name: body, label: "Description", widget: text }
          - { name: stay, label: "Overnight / accommodation", widget: string, required: false }
          - { name: photo, label: "Photo for this day", widget: image, required: false }
      - { name: wildlife, label: "Wildlife tags", widget: list, required: false, field: { name: item, widget: string } }
      - { name: birds, label: "Bird tags", widget: list, required: false, field: { name: item, widget: string } }
      - name: glance
        label: "At a glance (sidebar)"
        widget: list
        fields:
          - { name: key, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      - name: gallery
        label: "Gallery photos"
        widget: list
        required: false
        fields:
          - { name: image, label: Photo, widget: image, required: false }
          - { name: fallback, label: "Stand-in URL", widget: string, required: false }
      - { name: goodtoknow, label: "Good to know", widget: text, required: false }

  # ---------------------------- PARKS ----------------------------
  - name: parks
    label: Park Field Guides
    label_singular: Park
    folder: "jti-cms/src/content/parks"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: Park name, widget: string }
      - { name: slug, label: "Web address (slug)", widget: string }
      - { name: kicker, label: Kicker, widget: string, required: false }
      - { name: region, label: Region, widget: string, required: false }
      - { name: description, label: "Search description (SEO)", widget: text, required: false }
      - { name: hero_image, label: "Hero photo", widget: image, required: false }
      - { name: hero_fallback, label: "Stand-in photo URL", widget: string, required: false }
      - { name: lead, label: "Opening line", widget: text }
      - { name: intro, label: "Intro paragraphs", widget: list, field: { name: paragraph, widget: text } }
      - { name: see, label: "What you'll see (tags)", widget: list, field: { name: item, widget: string } }
      - { name: birdline, label: "Birds paragraph", widget: text, required: false }
      - { name: best, label: "Best time to visit", widget: text, required: false }
      - { name: reach, label: "How to reach it", widget: text, required: false }
      - name: glance
        label: "At a glance (sidebar)"
        widget: list
        fields:
          - { name: key, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      - { name: tours, label: "Journeys that visit this park (slugs)", widget: list, required: false, field: { name: slug, widget: string } }

  # --------------------------- GUIDES ---------------------------
  - name: guides
    label: Our Guides
    label_singular: Guide
    folder: "jti-cms/src/content/guides"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}  —  {{role}}"
    fields:
      - { name: name, label: Name, widget: string }
      - { name: slug, label: "Web address (slug)", widget: string, hint: "Lowercase, dashes. Changing this changes the page URL." }
      - { name: role, label: "Role (e.g. Senior Naturalist Guide)", widget: string }
      - { name: region, label: "Region / specialty area", widget: string, required: false }
      - { name: years, label: "Experience line (e.g. 18 years guiding)", widget: string, required: false }
      - { name: kicker, label: "Kicker (small line, e.g. Field Guide · Ladakh)", widget: string, required: false }
      - { name: description, label: "Search description (SEO)", widget: text, required: false }
      - { name: photo, label: "Portrait photo", widget: image, required: false, hint: "Leave empty to keep the current stand-in photo." }
      - { name: photo_fallback, label: "Stand-in photo URL", widget: string, required: false }
      - { name: intro, label: "Intro line (short, shown large on their page and card)", widget: text, required: false }
      - { name: bio, label: "Bio paragraph", widget: text, required: false }
      - { name: bio_link, label: "Bio — link URL (optional)", widget: string, required: false }
      - { name: bio_link_label, label: "Bio — link text (optional)", widget: string, required: false }
      - { name: languages, label: Languages, widget: string, required: false }
      - { name: specialties, label: "Specialty tags", widget: list, required: false, field: { name: item, widget: string } }
      - name: interview
        label: "Interview — questions & answers (leave empty to hide)"
        widget: list
        required: false
        summary: "{{fields.q}}"
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - name: favorite_place
        label: "Their favourite place"
        widget: object
        required: false
        fields:
          - { name: name, label: "Place name", widget: string }
          - { name: why, label: "Why they love it (quote)", widget: text }

  # --------------------------- STORIES ---------------------------
  - name: stories
    label: Field Notes (Journal)
    label_singular: Story
    folder: "jti-cms/src/content/stories"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: "Web address (slug)", widget: string }
      - { name: kicker, label: "Kicker (e.g. Assam · Ritual)", widget: string, required: false }
      - { name: byline, label: Byline, widget: string, required: false }
      - { name: description, label: "Search description (SEO)", widget: text, required: false }
      - { name: hero_image, label: "Hero photo", widget: image, required: false }
      - { name: hero_fallback, label: "Stand-in photo URL", widget: string, required: false }
      - { name: standfirst, label: "Standfirst (intro line)", widget: text }
      - name: meta
        label: "Fact row"
        widget: list
        fields:
          - { name: key, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      - { name: body, label: "Story", widget: markdown }

  # --------------------------- SETTINGS --------------------------
  - name: settings
    label: Pages & Settings
    files:
      - name: home
        label: Homepage
        file: "jti-cms/src/_data/home.json"
        fields:
          - { name: hero_eyebrow, label: "Hero — small line", widget: string }
          - { name: hero_title, label: "Hero — headline", widget: string }
          - { name: hero_lede, label: "Hero — intro line", widget: text }
          - name: hero_slides
            label: "Hero carousel photos"
            widget: list
            fields:
              - { name: image, label: Photo, widget: image, required: false }
              - { name: fallback, label: "Stand-in URL", widget: string, required: false }
          - name: cred
            label: "Credibility strip"
            widget: list
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
          - { name: intro_eyebrow, label: "Intro — small line", widget: string }
          - { name: intro_title, label: "Intro — heading", widget: string }
          - { name: intro_paras, label: "Intro — paragraphs", widget: list, field: { name: paragraph, widget: text } }
          - { name: intro_strip, label: "Intro — species strip", widget: string }
          - { name: intro_image, label: "Intro photo", widget: image, required: false }
          - { name: intro_fallback, label: "Intro stand-in URL", widget: string, required: false }
          - { name: why_image, label: "'Why travel with JTI' photo", widget: image, required: false }
          - { name: why_fallback, label: "'Why travel with JTI' stand-in URL", widget: string, required: false }
          - name: journeys
            label: "Signature journey cards"
            widget: list
            fields:
              - { name: href, label: Link, widget: string }
              - { name: eyebrow, label: Kicker, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: fallback, label: "Stand-in URL", widget: string, required: false }
          - name: parks
            label: "Parks strip"
            widget: list
            fields:
              - { name: href, label: Link, widget: string }
              - { name: kicker, label: Kicker, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: fallback, label: "Stand-in URL", widget: string, required: false }
          - { name: quote, label: "Testimonial quote", widget: text }
          - { name: quote_who, label: "Testimonial attribution", widget: string }
          - { name: enquire_title, label: "Enquiry section — heading", widget: string }
          - { name: enquire_text, label: "Enquiry section — text", widget: text }
          - { name: enquire_image, label: "Enquiry background photo", widget: image, required: false }
          - { name: enquire_fallback, label: "Enquiry stand-in URL", widget: string, required: false }
      - name: site
        label: Contact details
        file: "jti-cms/src/_data/site.json"
        fields:
          - { name: name, label: Company name, widget: string }
          - { name: phone, label: "Phone (display)", widget: string }
          - { name: phone_raw, label: "Phone (dial format)", widget: string }
          - { name: email, label: Email, widget: string }
          - { name: address, label: Address, widget: string }
          - { name: url, label: Website URL, widget: string }
      - name: our_story
        label: Our Story
        file: "jti-cms/src/_data/ourstory.json"
        fields:
          - { name: hero_eyebrow, label: "Hero — small line", widget: string }
          - { name: hero_title, label: "Hero — headline", widget: string }
          - { name: hero_image, label: "Hero photo", widget: image, required: false }
          - { name: hero_fallback, label: "Hero stand-in URL", widget: string, required: false }
          - name: hero_facts
            label: "Hero stat row (3 items)"
            widget: list
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
          - { name: founding_kicker, label: "Founding story — small line", widget: string }
          - { name: founding_title, label: "Founding story — heading", widget: string }
          - { name: founding_paragraphs, label: "Founding story — paragraphs", widget: list, field: { name: paragraph, widget: text } }
          - { name: timeline_kicker, label: "Timeline — small line", widget: string }
          - { name: timeline_title, label: "Timeline — heading", widget: string }
          - name: timeline
            label: "Timeline milestones"
            widget: list
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { name: year, label: "Year (or 'Add year' as a placeholder)", widget: string }
              - { name: title, label: "Milestone title", widget: string }
              - { name: text, label: "Milestone description", widget: text }
          - { name: timeline_note, label: "Small note under the timeline", widget: text, required: false }
          - { name: why_kicker, label: "Why-us cards — small line", widget: string }
          - { name: why_title, label: "Why-us cards — heading", widget: string }
          - name: why_cards
            label: "Why-us cards (3)"
            widget: list
            fields:
              - { name: kicker, label: "Small label", widget: string }
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
          - { name: team_kicker, label: "Team section — small line", widget: string }
          - { name: team_title, label: "Team section — heading", widget: string }
          - { name: team_paragraphs, label: "Team section — paragraphs", widget: list, field: { name: paragraph, widget: text } }
          - { name: team_cta_text, label: "Team section — link line", widget: text, required: false }
          - { name: team_cta_link, label: "Team section — link URL", widget: string, required: false }
          - { name: team_cta_label, label: "Team section — link label", widget: string, required: false }
          - { name: group_kicker, label: "Group section — small line", widget: string }
          - { name: group_title, label: "Group section — heading", widget: string }
          - { name: group_text, label: "Group section — description", widget: text }
          - name: sister_brands
            label: "Sister brands (logos) — leave empty to hide this row"
            widget: list
            required: false
            fields:
              - { name: name, label: "Brand name", widget: string }
              - { name: logo, label: "Logo image", widget: image, required: false }
              - { name: logo_white, label: "Logo is white (show it dark on the white card)", widget: boolean, required: false, default: false }
              - { name: url, label: "Website (optional)", widget: string, required: false }
              - { name: blurb, label: "Short description (optional)", widget: string, required: false }
          - { name: cta_title, label: "Closing banner — heading", widget: string }
